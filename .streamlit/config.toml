# Streamlit Configuration
[server]
maxUploadSize = 500
port = 8501
enableCORS = false
enableXsrfProtection = false

[theme]
primaryColor = "#4D9FFF"
backgroundColor = "#080E19"
secondaryBackgroundColor = "#111d30"
textColor = "#F1F5F9"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#0B1322"

[browser]
gatherUsageStats = false

